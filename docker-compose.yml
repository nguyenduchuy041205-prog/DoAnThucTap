services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cropcoop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cropcoop_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-cropcoop_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cropcoop} -d ${POSTGRES_DB:-cropcoop_dev}"]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-cropcoop}:${POSTGRES_PASSWORD:-cropcoop_dev_password}@db:5432/${POSTGRES_DB:-cropcoop_dev}?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      PUBLIC_TRACE_BASE_URL: ${PUBLIC_TRACE_BASE_URL:-http://localhost:5173}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - .:/workspace
      - api_node_modules:/workspace/node_modules
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - .:/workspace
      - web_node_modules:/workspace/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  api_node_modules:
  web_node_modules:
