      - name: slId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [QR Codes]
      operationId: checkQrEligibility
      summary: Kiểm tra ba điều kiện phát hành QR (TECHNICIAN trở lên)
      description: |
        Điều kiện đạt gồm nhật ký bắt buộc đã được xác nhận, thời gian cách ly đã an toàn,
        và kiểm nghiệm chất lượng đạt. Endpoint chỉ kiểm tra, không phát hành QR.
      responses:
        '200':
          description: Kết quả chi tiết từng điều kiện và QR hiện có (nếu có)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QrCheckResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /season-lots/{slId}/qr/generate:
    parameters:
      - name: slId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [QR Codes]
      operationId: requestQrCode
      summary: Tạo yêu cầu phát hành QR (TECHNICIAN trở lên)
      description: Server tính lại cả ba điều kiện trong transaction; không tin cờ điều kiện từ client.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expiresAt: { type: string, format: date }
