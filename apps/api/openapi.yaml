  /public/trace/{token}:
    get:
      tags: [Public Portal]
      operationId: getPublicTracePassport
      security: []
      summary: Tra cứu hộ chiếu lô từ QR, không cần đăng nhập
      description: Chỉ trả dữ liệu đã công khai; loại bỏ PII, thông tin tài chính và tọa độ GPS chính xác. Nhật ký chỉ gồm bản ghi CONFIRMED được đánh dấu công khai.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Hộ chiếu lô mùa vụ công khai
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicTracePassport' }
        '404':
          description: QR không tồn tại
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Error' }
                  - type: object
                    properties:
                      code: { type: string, example: QR_NOT_FOUND }
        '410':
          description: QR đã bị thu hồi
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Error' }
                  - type: object
                    properties:
                      code: { type: string, example: QR_REVOKED }
