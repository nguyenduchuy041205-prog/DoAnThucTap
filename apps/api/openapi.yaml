openapi: 3.0.3
info:
  title: CROP COOP API
  version: 1.0.0
  description: |
    REST API cho nền tảng quản lý hợp tác xã và truy xuất nguồn gốc.
    Farmer access is restricted to lots assigned through farmer_lots.

    Business flow:
    Create season → add lots and assign farmers → farmers create diary entries online/offline
    → sync offline entries → technician confirms diary → recalculate quarantine → record harvest
    and quality tests → check QR conditions → generate pending QR → coop admin approves and locks
    related diaries → customer scans the public trace passport.
servers:
  - url: https://api.cropcoop.vn/v1
    description: Production base URL theo đặc tả
  - url: http://localhost:3000/api/v1
    description: Local development
tags:
  - name: Auth
  - name: Users
  - name: Zones & Lots
  - name: Seasons
  - name: Diary
  - name: Quarantine
  - name: Inventory
  - name: Harvest & Quality
  - name: QR Codes
  - name: Public Portal
  - name: Orders
  - name: Reports
  - name: System Admin
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      summary: Đăng nhập
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: farmer@htx.vn }
                password: { type: string, format: password }
      responses:
        '200':
          description: Đăng nhập thành công; refresh token được gửi bằng HttpOnly cookie.
          headers:
            Set-Cookie:
              schema: { type: string, example: refreshToken=...; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth }
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, expiresIn, user]
                properties:
                  accessToken: { type: string }
                  tokenType: { type: string, example: Bearer }
                  expiresIn: { type: integer, example: 900 }
                  user: { $ref: '#/components/schemas/UserSession' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshAccessToken
      security: []
      summary: Cấp access token mới bằng refresh cookie
      responses:
        '200':
          description: Token mới; refresh token được xoay vòng trong HttpOnly cookie.
          headers:
            Set-Cookie:
              schema: { type: string, example: refreshToken=...; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth }
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  tokenType: { type: string, example: Bearer }
                  expiresIn: { type: integer, example: 900 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Thu hồi refresh token hiện tại và xóa cookie
      responses:
        '200': { description: Đã đăng xuất }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Lấy hồ sơ, vai trò và quyền của người dùng hiện tại
      responses:
        '200':
          description: Hồ sơ người dùng hiện tại
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/change-password:
    patch:
      tags: [Auth]
      operationId: changePassword
      summary: Đổi mật khẩu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 12 }
      responses:
        '200': { description: Đổi mật khẩu thành công }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: Danh sách thành viên (COOP_ADMIN trở lên)
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200':
          description: Danh sách phân trang
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedUsers' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      operationId: createUser
      summary: Tạo tài khoản (SUPER_ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, fullName, password]
              properties:
                email: { type: string, format: email }
                fullName: { type: string, maxLength: 150 }
                phone: { type: string }
                password: { type: string, format: password, minLength: 12 }
                roleCodes: { type: array, items: { $ref: '#/components/schemas/RoleCode' } }
      responses:
        '201':
          description: Tài khoản đã tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Users]
      operationId: getUser
      summary: Chi tiết thành viên (COOP_ADMIN trở lên hoặc chính mình)
      responses:
        '200':
          description: Hồ sơ thành viên
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Cập nhật hồ sơ thành viên
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: { type: string, maxLength: 150 }
                phone: { type: string, nullable: true }
                isActive: { type: boolean, description: Chỉ SUPER_ADMIN được thay đổi }
      responses:
        '200':
          description: Hồ sơ đã cập nhật
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Users]
      operationId: deactivateUser
      summary: Vô hiệu hóa tài khoản (soft delete, SUPER_ADMIN)
      responses:
        '204': { description: Tài khoản đã vô hiệu hóa }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/{id}/roles:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Users]
      operationId: assignUserRole
      summary: Gán vai trò (SUPER_ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId]
              properties:
                roleId: { type: string, format: uuid }
      responses:
        '201': { description: Vai trò đã được gán }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{id}/roles/{roleId}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - name: roleId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Users]
      operationId: removeUserRole
      summary: Gỡ vai trò (SUPER_ADMIN)
      responses:
        '204': { description: Vai trò đã được gỡ }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/{id}/lots:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Users]
      operationId: listUserLots
      summary: Danh sách lô được phân công; FARMER chỉ được xem dữ liệu của mình
      responses:
        '200':
          description: Các lô đang được phân công
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Lot' } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /zones:
    get:
      tags: [Zones & Lots]
      operationId: listZones
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200':
          description: Danh sách vùng
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedZones' }
    post:
      tags: [Zones & Lots]
      operationId: createZone
      summary: Tạo vùng (TECHNICIAN trở lên)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string }
                name: { type: string }
                description: { type: string }
                boundary: { type: object, description: GeoJSON Polygon/MultiPolygon }
                province: { type: string }
                district: { type: string }
                commune: { type: string }
      responses:
        '201':
          description: Vùng đã tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Zone' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /zones/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Zones & Lots]
      operationId: getZone
      responses:
        '200':
          description: Chi tiết vùng
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Zone' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Zones & Lots]
      operationId: updateZone
      summary: Cập nhật vùng (TECHNICIAN trở lên)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZonePatch' }
      responses:
        '200':
          description: Vùng đã cập nhật
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Zone' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /zones/{id}/lots:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Zones & Lots]
      operationId: listZoneLots
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200':
          description: Lô thuộc vùng; FARMER chỉ thấy lô được phân công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedLots' }
        '404': { $ref: '#/components/responses/NotFound' }
  /lots:
    get:
      tags: [Zones & Lots]
      operationId: listLots
      summary: Danh sách lô; phạm vi FARMER tự giới hạn theo farmer_lots
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - name: zoneId
          in: query
          schema: { type: string, format: uuid }
        - name: active
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Danh sách lô sau khi áp dụng phạm vi truy cập
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedLots' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Zones & Lots]
      operationId: createLot
      summary: Tạo lô (TECHNICIAN trở lên)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [zoneId, lotCode, name]
              properties:
                zoneId: { type: string, format: uuid }
                lotCode: { type: string }
                name: { type: string }
                centerLat: { type: number, minimum: -90, maximum: 90 }
                centerLng: { type: number, minimum: -180, maximum: 180 }
                areaM2: { type: number, minimum: 0, exclusiveMinimum: true }
                soilType: { type: string }
                notes: { type: string }
      responses:
        '201':
          description: Lô đã tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /lots/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Zones & Lots]
      operationId: getLot
      summary: Chi tiết lô; FARMER chỉ truy cập lô được phân công
      responses:
        '200':
          description: Thông tin lô
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lot' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Zones & Lots]
      operationId: updateLot
      summary: Cập nhật lô (TECHNICIAN trở lên)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                centerLat: { type: number, minimum: -90, maximum: 90, nullable: true }
                centerLng: { type: number, minimum: -180, maximum: 180, nullable: true }
                areaM2: { type: number, minimum: 0, exclusiveMinimum: true, nullable: true }
                soilType: { type: string, nullable: true }
                notes: { type: string, nullable: true }
                isActive: { type: boolean }
      responses:
        '200':
          description: Lô đã cập nhật
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lot' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /lots/{id}/assign-farmer:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Zones & Lots]
      operationId: assignFarmerToLot
      summary: Phân công nông dân cho lô (COOP_ADMIN trở lên)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [farmerId, startDate]
              properties:
                farmerId: { type: string, format: uuid }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date, nullable: true }
                ownershipType: { type: string, enum: [OWN, LEASE, CONTRACT] }
                notes: { type: string }
      responses:
        '201': { description: Đã phân công }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /lots/{id}/assign-farmer/{farmerId}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - name: farmerId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Zones & Lots]
      operationId: unassignFarmerFromLot
      summary: Kết thúc phân công hiện tại (COOP_ADMIN trở lên)
      responses:
        '204': { description: Phân công đã kết thúc }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /seasons:
    get:
      tags: [Seasons]
      operationId: listSeasons
      summary: Danh sách mùa vụ cho người dùng nội bộ
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200':
          description: Danh sách mùa vụ phân trang
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedSeasons' }
    post:
      tags: [Seasons]
      operationId: createSeason
      summary: Tạo mùa vụ (TECHNICIAN trở lên)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeasonCreate' }
      responses:
        '201':
          description: Mùa vụ đã tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Season' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /seasons/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Seasons]
      operationId: getSeason
      responses:
        '200':
          description: Chi tiết mùa vụ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Season' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Seasons]
      operationId: updateSeason
      summary: Cập nhật mùa vụ (TECHNICIAN trở lên)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeasonPatch' }
      responses:
        '200':
          description: Mùa vụ đã cập nhật
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Season' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /seasons/{id}/lots:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Seasons]
      operationId: addLotToSeason
      summary: Thêm lô và phân công nông dân vào mùa vụ (TECHNICIAN trở lên)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lotId, assignedFarmerId]
              properties:
                lotId: { type: string, format: uuid }
                assignedFarmerId: { type: string, format: uuid }
                plannedSowDate: { type: string, format: date }
                plannedHarvestDate: { type: string, format: date }
                materialQuotaKg: { type: number, minimum: 0 }
      responses:
        '201':
          description: Lô mùa vụ đã được tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeasonLot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRule' }
  /seasons/{id}/lots/{seasonLotId}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - name: seasonLotId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Seasons]
      operationId: removeLotFromSeason
      summary: Gỡ lô khỏi mùa vụ nếu không còn dữ liệu phụ thuộc
      responses:
        '204': { description: Đã gỡ lô khỏi mùa vụ }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /seasons/{id}/dashboard:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Seasons]
      operationId: getSeasonDashboard
      summary: Tổng quan tiến độ mùa vụ
      responses:
        '200':
          description: Chỉ số tổng hợp mùa vụ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeasonDashboard' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /season-lots/{slId}/diary:
    parameters:
      - name: slId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Diary]
      operationId: listSeasonLotDiary
      summary: Danh sách nhật ký; FARMER chỉ xem các lô được phân công
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/DiaryStatus' }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Danh sách nhật ký
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedDiaries' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Diary]
      operationId: createSeasonLotDiary
      summary: Tạo nhật ký, hỗ trợ retry an toàn bằng clientTempId
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: UUID ổn định do client tạo cho mỗi bản ghi offline; có thể thay bằng clientTempId trong payload.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiaryCreate' }
      responses:
        '201':
          description: Nhật ký đã tạo; kèm trạng thái cách ly mới nếu có áp dụng thuốc
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiaryCreateResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRule' }
  /season-lots/{slId}/diary/{id}:
    parameters:
      - name: slId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Diary]
      operationId: getSeasonLotDiary
      summary: Chi tiết nhật ký trong phạm vi được phép
      responses:
        '200':
          description: Nhật ký
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiaryEntry' }
        '403': { $ref: '#/components/responses/Forbidden' }
